# Netlify build settings. The site is static and needs no environment variables or API keys.
# Pages are prerendered to real files (index.html, work/arc/index.html, 404.html), so no rewrite rules are needed:
# /work/arc and /work/arc/ both serve the case study, and unknown addresses get 404.html.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
